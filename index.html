<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>bicycle park</title>
</head>
<body>
    <div class="layout">
        <main id="content">
            <div id="1">
                <h1>bicycle park</h1>
                <p>is there a park in front of N25?</p>
                <button id="1-yes-button">yes</button>
                <button id="1-no-button" class="no-button">no</button>
            </div>
            <div id="1-no" class="hidden">
                <hr />
                <p>find it.</p>
            </div>
            <div id="2" class="hidden">
                <hr />
                <img src="images/2.png" class="images">
                <p>does it have bicycle parking?</p>
                <button id="2-yes-button">yes</button>
                <button id="2-no-button" class="no-button">no</button>
            </div>
            <div id="2-no" class="hidden">
                <hr />
                <p>find it.</p>
            </div>
            <div id="3" class="hidden">
                <hr />
                <img src="images/3.png" class="images">
                <p>are the bicycles there?</p>
                <button id="3-yes-button">yes</button>
                <button id="3-no-button" class="no-button">no</button>
            </div>
            <div id="3-yes" class="hidden">
                <hr />
                <img src="images/3yes.png" class="images">
                <p>here?</p>
            </div>
            <div id="4" class="hidden">
                <hr />
                <img src="images/4.png" class="images">
                <p>where are the bicycles?</p>
                <button id="4-yes-button">everywhere</button>
                <button id="4-no-button" class="no-button">nowhere</button>
            </div>
            <div id="4-no" class="hidden">
                <hr />
                <p>find them.</p>
            </div>
            <div id="5" class="hidden">
                <hr />
                <img src="images/5.png" class="images">
                <p>bicycle park.</p>
            </div>
        </main>

        <footer>
            <div>2026 Spring KAIST ID20012 Project - Bumgyu</div>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const content = document.getElementById('content');

            function setVisible(ids) {
                content.querySelectorAll('div').forEach(div => {
                    if (ids.includes(div.id)) {
                        div.classList.remove('hidden');
                    } else {
                        div.classList.add('hidden');
                    }
                });
            }

            setVisible(['1']);

            document.getElementById('1-no-button').addEventListener('click', () => {
                setVisible(['1', '1-no']);
            });

            document.getElementById('1-yes-button').addEventListener('click', () => {
                setVisible(['1', '2']);
            });

            document.getElementById('2-no-button').addEventListener('click', () => {
                setVisible(['1', '2', '2-no']);
            });

            document.getElementById('2-yes-button').addEventListener('click', () => {
                setVisible(['1', '2', '3']);
            });

            document.getElementById('3-yes-button').addEventListener('click', () => {
                setVisible(['1', '2', '3', '3-yes']);
            });

            document.getElementById('3-no-button').addEventListener('click', () => {
                setVisible(['1', '2', '3', '4']);
            });

            document.getElementById('4-no-button').addEventListener('click', () => {
                setVisible(['1', '2', '3', '4', '4-no']);
            });

            document.getElementById('4-yes-button').addEventListener('click', () => {
                setVisible(['1', '2', '3', '4', '5']);
            });
        });
    </script>
</body>
</html>
